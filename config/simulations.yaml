# Simulation and FPGA task definitions.
# Paths for blhex, phex and blcoe are relative to build/program/.
# A simulation task names a testbench module; an FPGA task names a synthesis top.

defaults:
  blhex: boot/bootloader_phase1.hex

tasks:
  # ── 集成仿真 ──

  cpu_full:
    tb: tb_cpu_full
    phex: test/integration/cpu_full.hex
    runtime: 50s

  # ── DDR3仿真 ──

  cpu_full_ddr3:
    tb: tb_cpu_full
    blhex: boot/bootloader.hex
    verilog_defines:
      SIM_BYPASS_INIT_CAL: FAST
      SIMU_USE_DDR: 1
      SIMU_USE_PLL: 0
      SIMU_DDR_MODE: 1
      sg125: 1
    phex: test/integration/cpu_full.hex
    runtime: 1s

  cpu_compute:
    tb: tb_cpu_compute
    phex: test/integration/cpu_compute.hex
    runtime: 5ms

  cpu_trap:
    tb: tb_cpu_trap
    phex: test/integration/cpu_trap.hex
    runtime: 3ms

  # ── ISA 仿真 ──

  isa_alu:
    tb: tb_program
    phex: test/isa/alu.hex
    runtime: 5ms

  isa_branch:
    tb: tb_program
    phex: test/isa/branch.hex
    runtime: 5ms

  isa_memory:
    tb: tb_program
    phex: test/isa/memory.hex
    runtime: 5ms

  isa_upper_imm:
    tb: tb_program
    phex: test/isa/upper_imm.hex
    runtime: 5ms

  isa_jump:
    tb: tb_program
    phex: test/isa/jump.hex
    runtime: 5ms

  isa_csr:
    tb: tb_program
    phex: test/isa/csr.hex
    runtime: 5ms

  isa_m_ext:
    tb: tb_program
    phex: test/isa/m_ext.hex
    runtime: 5ms

  isa_a_ext:
    tb: tb_program
    phex: test/isa/a_ext.hex
    runtime: 200ms
    verilog_defines:
      TB_MAX_CYCLES: 2000000

  # ── 异常仿真 ──

  exception_ecall:
    tb: tb_program
    phex: test/exception/ecall.hex
    runtime: 5ms

  exception_ebreak:
    tb: tb_program
    phex: test/exception/ebreak.hex
    runtime: 5ms

  exception_illegal_inst:
    tb: tb_program
    phex: test/exception/illegal_inst.hex
    runtime: 5ms

  exception_access_fault:
    tb: tb_program
    phex: test/exception/access_fault.hex
    runtime: 5ms

  exception_timer_irq:
    tb: tb_program
    phex: test/exception/timer_irq.hex
    runtime: 10ms

  exception_interrupt_basic:
    tb: tb_program
    phex: test/exception/interrupt_basic.hex
    runtime: 10ms

  # ── 特权仿真 ──

  privilege_priv_transition:
    tb: tb_program
    phex: test/privilege/priv_transition.hex
    runtime: 20ms

  privilege_delegation:
    tb: tb_program
    phex: test/privilege/delegation.hex
    runtime: 20ms

  privilege_csr_access_priv:
    tb: tb_program
    phex: test/privilege/csr_access_priv.hex
    runtime: 10ms

  privilege_wfi:
    tb: tb_program
    phex: test/privilege/wfi.hex
    runtime: 10ms

  privilege_counter_access:
    tb: tb_program
    phex: test/privilege/counter_access.hex
    runtime: 10ms

  # ── MMU 仿真 ──

  mmu_sv32_basic:
    tb: tb_program
    phex: test/mmu/sv32_basic.hex
    runtime: 20ms

  mmu_tlb_basic:
    tb: tb_program
    phex: test/mmu/tlb_basic.hex
    runtime: 20ms

  mmu_tlb_flush:
    tb: tb_program
    phex: test/mmu/tlb_flush.hex
    runtime: 20ms
  mmu_sfence_handshake_unit:
    tb: tb_sfence
    runtime: 20us

  mmu_page_fault:
    tb: tb_program
    phex: test/mmu/page_fault.hex
    runtime: 20ms

  mmu_permission:
    tb: tb_program
    phex: test/mmu/permission.hex
    runtime: 20ms

  mmu_tlb_replace:
    tb: tb_program
    phex: test/mmu/tlb_replace.hex
    runtime: 20ms

  mmu_tlb_asid:
    tb: tb_program
    phex: test/mmu/tlb_asid.hex
    runtime: 20ms

  mmu_tlb_megapage:
    tb: tb_program
    phex: test/mmu/tlb_megapage.hex
    runtime: 20ms

  mmu_tlb_stress:
    tb: tb_program
    phex: test/mmu/tlb_stress.hex
    runtime: 20ms

  mmu_ptw_walk:
    tb: tb_program
    phex: test/mmu/ptw_walk.hex
    runtime: 20ms

  mmu_sv32_edge:
    tb: tb_program
    phex: test/mmu/sv32_edge.hex
    runtime: 20ms

  mmu_unified_mmu:
    tb: tb_program
    phex: test/mmu/unified_mmu.hex
    runtime: 150ms
    verilog_defines:
      TB_MAX_CYCLES: 2000000

  # ── Cache 仿真 ──

  cache_icache_basic:
    tb: tb_program
    phex: test/cache/icache_basic.hex
    runtime: 5ms

  cache_dcache_basic:
    tb: tb_program
    phex: test/cache/dcache_basic.hex
    runtime: 5ms

  cache_dcache_dirty:
    tb: tb_program
    phex: test/cache/dcache_dirty.hex
    runtime: 5ms

  cache_fencei:
    tb: tb_program
    phex: test/cache/fencei.hex
    runtime: 10ms

  cache_mmu_interact:
    tb: tb_program
    phex: test/cache/cache_mmu_interact.hex
    runtime: 20ms

  # ── MMIO 仿真 ──

  mmio_clint:
    tb: tb_program
    phex: test/mmio/clint.hex
    runtime: 160ms
    verilog_defines:
      TB_MAX_CYCLES: 15000000

  mmio_plic:
    tb: tb_program
    phex: test/mmio/plic.hex
    runtime: 160ms
    verilog_defines:
      TB_MAX_CYCLES: 15000000

  # ── 回归仿真 ──

  reg_tlb_fill_way:
    tb: tb_program
    phex: test/regression/reg_tlb_fill_way.hex
    runtime: 20ms

  reg_ptw_fault_latch:
    tb: tb_program
    phex: test/regression/reg_ptw_fault_latch.hex
    runtime: 20ms

  reg_sfence_during_walk:
    tb: tb_program
    phex: test/regression/reg_sfence_during_walk.hex
    runtime: 20ms

  reg_stale_paddr:
    tb: tb_program
    phex: test/regression/reg_stale_paddr.hex
    runtime: 20ms

  reg_bare_no_miss:
    tb: tb_program
    phex: test/regression/reg_bare_no_miss.hex
    runtime: 10ms

  reg_mmio_ready:
    tb: tb_program
    phex: test/regression/reg_mmio_ready.hex
    runtime: 60ms

  reg_dcache_refill_error:
    tb: tb_dcache_refill_error
    phex: test/regression/reg_dcache_refill_error.hex
    runtime: 20ms

  reg_dcache_store_error:
    tb: tb_dcache_store_error
    phex: test/regression/reg_dcache_store_error.hex
    runtime: 20ms

  reg_pf_latch:
    tb: tb_program
    phex: test/regression/reg_pf_latch.hex
    runtime: 20ms

  reg_linux_ptr_reload:
    tb: tb_program
    phex: test/regression/reg_linux_ptr_reload.hex
    runtime: 20ms

  reg_linux_field_values:
    tb: tb_program
    phex: test/regression/reg_linux_field_values.hex
    runtime: 20ms

  # ── 应用仿真 ──

  uart_hello:
    tb: tb_uart_hello
    phex: app/uart_hello.hex
    runtime: 20ms

  uart_echo:
    tb: tb_uart_echo
    phex: app/uart_echo.hex
    runtime: 50ms

  led_marquee:
    tb: tb_led_marquee
    phex: app/led_marquee_sim.hex
    runtime: 2s

  # ── 单元仿真 ──

  axi_interconnect:
    tb: tb_axi_interconnect
    runtime: 5000ns

  apb_peripherals:
    tb: tb_apb_peripherals
    runtime: 200us

  axi4lite_plic_unit:
    tb: tb_plic
    runtime: 20us

  axi4lite_clint_unit:
    tb: tb_clint
    runtime: 20us

  cpu_trap_router_unit:
    tb: tb_trap_router
    runtime: 20us
  csr_privileged_unit:
    tb: tb_csr
    runtime: 20us
  ptw_global_unit:
    tb: tb_ptw
    runtime: 20us
  cpu_controller_unit:
    tb: tb_cpu_controller
    runtime: 20us
  cpu_mem_contract_unit:
    tb: tb_memory_contract
    runtime: 20us
  exception_contract_unit:
    tb: tb_exception
    runtime: 20us
  stage_exception_unit:
    tb: tb_stage_exception
    runtime: 20us
  pmp_pma_unit:
    tb: tb_pmp_pma
    runtime: 20us
  cpu_bus_bridge_unit:
    tb: tb_cpu_bus_bridge
    runtime: 100us
  dcache_writethrough_unit:
    tb: tb_dcache
    runtime: 100us
  regression_m_irq_precision:
    tb: tb_interrupt_precision
    runtime: 20us
  icache_blocking_unit:
    tb: tb_icache
    runtime: 100us
  fpga:
    top: system_top
    blcoe: boot/bootloader.coe
    verilog_defines:
      SIMU_USE_DDR: 1
      SIMU_USE_PLL: 1
  kernel_boot_ddr3:
    tb: tb_kernel_boot
    phex: firmware/fw_payload.hex
    runtime: 300s
    verilog_defines:
      SIM_BYPASS_INIT_CAL: FAST
      SIMU_USE_DDR: 1
      SIMU_USE_PLL: 0
      SIMU_DDR_MODE: 1
      sg125: 1

  kernel_boot_sram:
    tb: tb_kernel_boot
    phex: firmware/fw_payload.hex
    runtime: 300s
    verilog_defines:
      SIMU_USE_DDR: 0
      SIMU_USE_PLL: 0

  # Compile/elaboration smoke for the Linux-specific testbench. It deliberately
  # uses a small built-in program so RTL/TB compatibility can be checked before
  # an externally generated OpenSBI/Linux payload is available.
  kernel_tb_compile_smoke:
    tb: tb_kernel_boot
    phex: test/integration/cpu_trap.hex
    runtime: 1us
    verilog_defines:
      SIMU_USE_DDR: 0
      SIMU_USE_PLL: 0

groups:
  short:
    - isa_m_ext
    - isa_a_ext
    - exception_interrupt_basic
    - privilege_delegation
    - mmu_permission
    - mmu_tlb_replace
    - mmu_sfence_handshake_unit
    - cache_mmu_interact
    - mmio_plic
    - axi_interconnect
    - cpu_controller_unit
    - cpu_mem_contract_unit
    - exception_contract_unit
    - stage_exception_unit
    - pmp_pma_unit
    - cpu_trap_router_unit
    - csr_privileged_unit
    - ptw_global_unit
    - cpu_bus_bridge_unit
    - dcache_writethrough_unit
    - icache_blocking_unit
    - regression_m_irq_precision
    - kernel_tb_compile_smoke

# ============================================================
# build.yaml — 统一编译配置（测试 + 应用）
# ============================================================
#
# 声明式定义所有测试程序和应用目标的依赖、构建参数。
# test_builder.py 读取此文件驱动构建。
#
# 路径约定: 相对于 src/program_source/
#
# ============================================================

# ── 框架定义 ──

framework:
  # 通用框架: 所有非 MMU 测试使用
  common:
    - framework/test_framework.s
    - framework/trap_handlers.s

  # MMU 框架: 额外包含页表工具和 PTE 常量
  mmu:
    - framework/test_framework.s
    - framework/trap_handlers.s
    - framework/page_table_utils.s

  # 无框架: 集成测试保持原有结构
  none: []

# ── 全局默认值 ──

defaults:
  arch: rv32im_zicsr_zifencei
  abi: ilp32
  linker_script: link.ld
  depth: 8192

# ── 测试类别 ──

categories:
  isa:
    framework: common
    arch: rv32ima_zicsr_zifencei
    abi: ilp32
    tests:
      - isa/alu
      - isa/branch
      - isa/memory
      - isa/upper_imm
      - isa/jump
      - isa/csr
      - isa/m_ext
      - isa/a_ext

  exception:
    framework: common
    tests:
      - exception/ecall
      - exception/ebreak
      - exception/illegal_inst
      - exception/access_fault
      - exception/timer_irq
      - exception/interrupt_basic

  privilege:
    framework: mmu
    tests:
      - privilege/priv_transition
      - privilege/delegation
      - privilege/csr_access_priv
      - privilege/wfi
      - privilege/counter_access

  mmu:
    framework: mmu
    tests:
      - mmu/sv32_basic
      - mmu/tlb_basic
      - mmu/tlb_replace
      - mmu/tlb_flush
      - mmu/tlb_asid
      - mmu/tlb_megapage
      - mmu/tlb_stress
      - mmu/ptw_walk
      - mmu/page_fault
      - mmu/permission
      - mmu/sv32_edge
      - mmu/unified_mmu

  cache:
    framework: common
    tests:
      - cache/icache_basic
      - cache/dcache_basic
      - cache/dcache_dirty
      - cache/fencei

  cache_mmu:
    framework: mmu
    tests:
      - cache/cache_mmu_interact

  mmio:
    framework: common
    tests:
      - mmio/clint
      - mmio/plic

  regression:
    framework: mmu
    tests:
      - regression/reg_tlb_fill_way
      - regression/reg_ptw_fault_latch
      - regression/reg_sfence_during_walk
      - regression/reg_stale_paddr
      - regression/reg_bare_no_miss
      - regression/reg_pf_latch
      - regression/reg_linux_ptr_reload
      - regression/reg_linux_field_values

  regression_common:
    framework: common
    tests:
      - regression/reg_mmio_ready
      - regression/reg_dcache_refill_error
      - regression/reg_dcache_store_error

  integration:
    framework: none
    tests:
      - integration/cpu_full
      - integration/cpu_compute
      - integration/cpu_trap

# ── 应用目标 ──
#
# 每个应用指定:
#   src_files:       源文件列表（相对于 src/program_source/）
#   arch:            目标架构（缺省继承 defaults.arch）
#   abi:             ABI（缺省继承 defaults.abi）
#   linker_script:   链接脚本（缺省继承 defaults.linker_script；设为 null 显式禁用）
#   include_dirs:    头文件搜索路径（缺省为 []）
#   depth:           内存深度（缺省继承 defaults.depth）

apps:
  led_marquee:
    src_files:
      - app/led_marquee.s
    linker_script: null

  uart_hello:
    src_files:
      - app/uart_hello.s
    linker_script: null

  uart_echo:
    src_files:
      - app/uart_echo.s
    linker_script: null

  uart_echo_c_lib:
    src_files:
      - lib/start.S
      - lib/uart.c
      - app/uart_echo_c_lib.c
    include_dirs:
      - lib/include

# Task definitions for Vivado orchestration
# Each task maps to a testbench + optional program image + runtime
# For FPGA-only tasks (bitstream), specify 'top' instead of 'tb'
#
# ⚠ COE field in simulation:
#   The `coe` field is used ONLY for FPGA bitstream generation (BRAM IP initialization).
#   In simulation, `ifdef SIMULATION` bypasses COE loading entirely — the RTL uses
#   $readmemh("prog.hex") to load the hex file directly instead (see axi_wrap_ram.sv,
#   axi4lite_bootrom.sv).  The `hex_file` field (or auto-derived from `coe` by
#   replacing .coe → .hex) is what actually takes effect during simulation.
#   The `coe` field still serves two indirect purposes in simulation:
#     1. Auto-derivation of hex_file path (if hex_file is not explicitly set)
#     2. COE-layer hash staleness detection for incremental refresh
#
# Task categories (annotated per section):
#   仿真       — behavioral simulation (SIMULATION=TRUE auto-injected)
#   DDR3仿真   — DDR3 model simulation (sim_mode: ddr3, SIMULATION in verilog_defines)
#   FPGA上板   — bitstream generation + JTAG programming (top module, no tb)

tasks:
  # ── Linux 启动仿真 ──

  linux_boot:
    tb: tb_simple_cpu_top
    blhex: boot/bootloader_phase1.hex
    phex: firmware/fw_payload.hex
    runtime: 60s
    verilog_defines:
      LINUX_BOOT: "TRUE"


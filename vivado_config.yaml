# Vivado orchestration global configuration

limits:
  max_sessions: 15
  max_concurrent: 4
  max_disk_gb: 20
  idle_timeout_min: 1200    # session idle timeout (minutes)
  # Operation timeouts (seconds)
  create_timeout: 300       # create project + add sources
  refresh_timeout: 300      # incremental/full refresh
  sim_timeout: 72000         # simulation (was 600, increased for DDR3 calib)
  sim_rerun_timeout: 72000   # sim prj-patch rerun (MIG calib needs ~1h)
  bitstream_timeout: 3600   # synthesis + implementation
  program_timeout: 120      # FPGA programming via JTAG
  archive_timeout: 300      # project archiving

vivado_path: vivado
proj_name: simplecpu_soc
device_part: xc7a200tfbg676-2

# ---------------------------------------------------------------------------
# Memory / Cache configuration
# Changing these values will regenerate both IP (create_ip TCL) and
# RTL header (cache_def.svh) to keep them in sync.
# ---------------------------------------------------------------------------
memory:
  rom:
    data_width: 32        # ROM word width (bits)
    depth: 8192           # ROM depth (words) — 32KB for 32-bit width
    byte_enable: true     # Byte-write enable for ROM (4-bit WEA for byte/halfword writes)
    byte_size: 8          # Byte size (WEA width = data_width / byte_size = 4)

  icache:
    num_sets: 8           # Number of cache sets
    num_ways: 4           # Associativity (ways per set) — ⚠ FIXED: do not change (tree_plru hardcoded)
    tag_width: 19         # Tag field width (bits) — covers 128MB DDR3 address space
    line_words: 8         # Words per cache line (line_width = line_words * 32)
    byte_enable: true     # Byte-write enable for data BRAM
    byte_size: 8          # Byte size for write-enable granularity
    tag_bram_byte_enable: true   # Byte-write enable for tag BRAM
    tag_bram_byte_size: 36      # Way stride = 36 for icache (V1+tag19=20 bits/way, padded to 36)
    tag_bram_xilinx_byte_size: 9  # Xilinx BRAM Byte_Size param (Vivado 2018.3 only accepts 8 or 9)

  dcache:
    num_sets: 8
    num_ways: 4           # ⚠ FIXED: do not change (tree_plru hardcoded)
    tag_width: 19         # covers 128MB DDR3 address space
    line_words: 8
    byte_enable: true
    byte_size: 8
    tag_bram_byte_enable: true   # Byte-write enable for tag BRAM
    tag_bram_byte_size: 36      # Way stride = 36 for dcache (V1+D1+tag19=22 bits/way, padded to 36)
    tag_bram_xilinx_byte_size: 9  # Xilinx BRAM Byte_Size param (Vivado 2018.3 only accepts 8 or 9)

  # Tag storage: false = register arrays (current), true = BRAM IPs (icachet/dcachet)
  use_tag_bram: true

  tlb:
    num_ways: 4           # Associativity — ⚠ FIXED: do not change (tree_plru hardcoded)
    num_sets: 4           # Number of TLB sets (total entries = num_ways × num_sets = 16)
    flag_byte_enable: true   # Byte-write enable for flag BRAM
    flag_byte_size: 8        # Byte size = 8 (WEA width = 128/8 = 16, 4 bits per 32-bit way)
    data_byte_enable: true   # Byte-write enable for data BRAM
    data_byte_size: 8        # Byte size = 8 (WEA width = 128/8 = 16, 4 bits per 32-bit way)

  # TLB storage: false = register array (current), true = BRAM IPs (tlb_flag/tlb_data)
  use_tlb_bram: true

  # DDR3 main memory via MIG 7 Series (AXI4 native)
  ddr3:
    enabled: true
    ip_name: mig_axi_32
    ip_version: "4.2"
    mig_prj_file: Reference/mig/mig_a.prj
    mem_size: 134217728          # 128MB
    axi_addr_width: 27
    axi_data_width: 32
    axi_id_width: 8
    supports_narrow_burst: true
    data_rate: 800               # Mbps
    input_clk_freq: 100          # MHz

  clk_wiz:
    enabled: true
    ip_name: clk_wiz_0
    ip_version: "6.0"
    prim_in_freq: 100.0          # MHz, external crystal
    mmcm_clkin_period: 10.0      # ns
    mmcm_clkfbout_mult_f: 10.0   # VCO = 1000MHz
    mmcm_divclk_divide: 1
    num_out_clks: 3
    clk_out1_freq: 50.0          # MHz, cpu_clk (CPU core)
    clk_out2_freq: 100.0         # MHz, sys_clk (AXI interconnect + MIG sys_clk_i)
    clk_out3_freq: 200.0         # MHz, ddr_clk_ref → MIG clk_ref_i
    reset_type: ACTIVE_LOW

# ---------------------------------------------------------------------------
# RTL path configuration
# Sub-directory paths relative to dev/rtl/ used by project creation
# and testbench import.  Change these if the project directory layout
# is restructured.
# ---------------------------------------------------------------------------
rtl_path:
  alu: ALU
  mu: MU
  fpu: FPU
  cpu_core: core
  common: common
  ahb: axi
  ahb_ip: axi/ip
  amba: AMBA
  ram_wrap: ram_wrap
  apb: APB
  apb_header: APB/header
  apb_perips: APB/perips
  apb_uart16550: APB/perips/uart16550
  sys_rtl: ""                   # dev/rtl root (empty = dev/rtl itself)
  tb: ""                        # dev/tb (handled relative to dev/, not dev/rtl/)
